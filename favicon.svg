<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Скругленный светлый фон плашки -->
  <rect width="32" height="32" rx="6" fill="#F4F5F7"/>
  
  <!-- Основная рамка экрана мониторинга -->
  <rect x="3" y="5" width="26" height="22" rx="3" fill="none" stroke="#0052CC" stroke-width="2"/>
  
  <!-- Спидометр / Индикатор доступности (слева сверху) -->
  <path d="M6 16A6 6 0 0 1 18 16" fill="none" stroke="#0052CC" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <!-- Стрелка прибора -->
  <line x1="12" y1="16" x2="15" y2="11" stroke="#0052CC" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Строки текста/индикаторов (слева снизу) -->
  <line x1="6" y1="21" x2="14" y2="21" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="11" y2="24" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Мини-индикаторы (справа сверху) -->
  <line x1="21" y1="9" x2="25" y2="9" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="12" x2="23" y2="12" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Столбики графика (справа снизу) -->
  <rect x="18" y="20" width="2" height="4" fill="#0052CC"/>
  <rect x="21" y="17" width="2" height="7" fill="#0052CC"/>
  <rect x="24" y="15" width="2" height="9" fill="#0052CC"/>
</svg>
