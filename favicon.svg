<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Внешний контур -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="none" stroke="#0052FF" stroke-width="3" />
  
  <!-- Верхний левый: нейтральный блок -->
  <rect x="5" y="5" width="11" height="11" rx="2.5" fill="#FFFFFF" />
  
  <!-- Верхний правый: зеленый (крупный и ближе к остальным) -->
  <rect x="16" y="5" width="11" height="11" rx="2.5" fill="#00C853" />
  
  <!-- Нижний левый: красный (крупный и ближе к остальным) -->
  <rect x="5" y="16" width="11" height="11" rx="2.5" fill="#FF3D00" />
  
  <!-- Нижний правый: нейтральный блок -->
  <rect x="16" y="16" width="11" height="11" rx="2.5" fill="#FFFFFF" />
</svg>
